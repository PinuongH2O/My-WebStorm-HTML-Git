<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" />
    <title>Document</title>
  </head>
  <body>
    <!--Thẻ chèn video-->
    <video src="./assets/video.mp4" type="video/mp4"></video>
    <!--Thẻ video với các thuộc tính khác-->
    <video src="./assets/video.mp4" type="video/mp4" controls></video>
    <video src="./assets/video.mp4" type="video/mp4" autoplay></video>
    <video src="./assets/video.mp4" type="video/mp4" loop></video>
    <video src="./assets/video.mp4" type="video/mp4" muted></video>
    <video
      src="./assets/video.mp4"
      type="video/mp4"
      poster="./assets/video-poster.jpg"
    ></video>
    <video
      src="./assets/video.mp4"
      type="video/mp4"
      controls
      width="400"
      height="300"
    ></video>
  </body>
</html>
